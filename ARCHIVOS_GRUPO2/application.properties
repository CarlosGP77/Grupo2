# Configuración de aplicación para Grupo2
# ✅ Arreglada para conexión correcta con MariaDB

spring.application.name=Grupo2-BdConSpringBoot

# ============================================
# BASE DE DATOS - MariaDB
# ============================================
spring.datasource.url=${DB_URL:jdbc:mariadb://mariadb:3306/mourosub}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin_123}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
# validate: solo valida schema (producción)
# update: actualiza schema (desarrollo)
# create-drop: crea nuevo en cada startup (desarrollo)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ============================================
# DATASOURCE - Connection Pool (HikariCP)
# ============================================
spring.datasource.continue-on-error=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================
# SERVIDOR - SIN SSL (solo en desarrollo)
# ============================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.servlet.session.timeout=30m

# SI NECESITAS SSL, descomentar y asegúrate de tener keystore.p12
# server.ssl.enabled=true
# server.ssl.key-store=file:/app/keystore.p12
# server.ssl.key-store-password=${SSL_PASSWORD:Admin_123}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=springboot

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example=DEBUG

# ============================================
# THYMELEAF (si lo usas)
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true

