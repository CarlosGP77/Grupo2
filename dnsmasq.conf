# dnsmasq configuration for Grupo2 Docker environment

# Interface and network settings
interface=eth0
listen-address=0.0.0.0
bind-interfaces

# DNS settings
domain-needed
bogus-priv
no-resolv
no-poll

# Upstream DNS servers (Google Public DNS)
server=8.8.8.8
server=8.8.4.4
server=1.1.1.1

# Local domain
domain=grupo2.local

# DNS records for internal services
address=/reverse-proxy.grupo2.local/172.18.0.6
address=/nginx.grupo2.local/172.18.0.6
address=/app.grupo2.local/172.18.0.4
address=/grupo2-app.grupo2.local/172.18.0.4
address=/nextcloud.grupo2.local/172.18.0.5
address=/nextcloud-app.grupo2.local/172.18.0.5
address=/db.grupo2.local/172.18.0.3
address=/mariadb.grupo2.local/172.18.0.3
address=/grupo2-mariadb.grupo2.local/172.18.0.3
address=/dns.grupo2.local/172.18.0.2
address=/dnsmasq.grupo2.local/172.18.0.2

# Cache settings
cache-size=1000
neg-ttl=3600

# DHCP settings (if needed)
# dhcp-range=172.18.50.0,172.18.150.0,24h
# dhcp-option=3,172.18.0.1
# dhcp-option=6,172.18.0.2

# Logging
log-queries
log-facility=/var/log/dnsmasq.log
log-async

# Performance
all-servers
min-cache-ttl=0
max-cache-ttl=3600

# Enable dnsmasq service
enable-dbus