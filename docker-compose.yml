
services:
  mariadb:
    image: mariadb:11
    container_name: grupo2-mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: admin_123
      MARIADB_DATABASE: mourosub
      MARIADB_AUTO_UPGRADE: 1

    volumes:
      - db_data:/var/lib/mysql

    ports:
      - "3306:3306"

    networks:
      - grupo2-network

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: grupo2-app
    restart: unless-stopped

    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/mourosub
      DB_USER: root
      DB_PASSWORD: admin_123
      JPA_DDL_AUTO: create-drop
      SERVER_PORT: 443
      SERVER_SSL_ENABLED: true
      SERVER_KEYSTORE: /app/keystore.p12
      SERVER_KEYSTORE_PASSWORD: Admin_123

    ports:
      - "443:443"

    networks:
      - grupo2-network

    depends_on:
      mariadb:
        condition: service_healthy

    # App healthcheck removed (use container status + logs). If you want an https healthcheck,
    # ensure the runtime image includes curl/wget and adjust the command to use --no-check-certificate.

volumes:
  db_data:
    driver: local

networks:
  grupo2-network:
    driver: bridge
