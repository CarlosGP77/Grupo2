version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: grupo2_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-admin_123}
      MARIADB_DATABASE: ${DB_NAME:-mourosub}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  redirect:
    image: nginx:1.27-alpine
    container_name: grupo2_redirect
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx/redirect.conf:/etc/nginx/conf.d/default.conf:ro

  app:
    build: .
    container_name: grupo2_app
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-mourosub}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-admin_123}
    volumes:
      - /root/ssl/keystore.p12:/app/keystore.p12
    ports:
      - "443:8080"

volumes:
  db_data:
