version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=admin_123
      - MARIADB_DATABASE=mourosub
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: grupo2_app
    restart: unless-stopped
    environment:
      - DB_URL=jdbc:mariadb://mariadb:3306/mourosub
      - DB_USER=root
      - DB_PASSWORD=admin_123
    volumes:
      - type: bind
        source: /root/ssl/keystore.p12
        target: /app/keystore.p12
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"

volumes:
  db_data:
