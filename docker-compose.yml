
services:
  dnsmasq:
    image: jpillora/dnsmasq:latest
    container_name: grupo2-dnsmasq
    restart: unless-stopped

    environment:
      HTTP_USER: admin
      HTTP_PASS: admin_123

    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf

    ports:
      - "53:53/tcp"
      - "53:53/udp"

    networks:
      - grupo2-network

    healthcheck:
      test: ["CMD", "nslookup", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mariadb:
    image: mariadb:11
    container_name: grupo2-mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: admin_123
      MARIADB_DATABASE: mourosub
      MARIADB_AUTO_UPGRADE: 1

    volumes:
      - db_data:/var/lib/mysql

    ports:
      - "3306:3306"

    networks:
      - grupo2-network

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  reverse-proxy:
    image: nginx:latest
    container_name: grupo2-nginx
    restart: unless-stopped

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

    ports:
      - "80:80"
      - "443:443"

    networks:
      - grupo2-network

    depends_on:
      app:
        condition: service_started
      nextcloud_app:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nextcloud_app:
    image: nextcloud:latest
    container_name: grupo2-nextcloud
    restart: unless-stopped

    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_PASSWORD:-admin_123}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 nextcloud_app"
      OVERWRITEPROTOCOL: http
      OVERWRITEHOST: nextcloud_app:80

    volumes:
      - nextcloud_data:/var/www/html
      - nextcloud_config:/var/www/html/config

    ports:
      - "8888:80"

    networks:
      - grupo2-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: grupo2-app
    restart: unless-stopped

    environment:
      # Database Configuration
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: mourosub
      DB_USERNAME: root
      DB_PASSWORD: admin_123
      JPA_DDL_AUTO: update

      # Server Configuration
      SERVER_PORT: 8080
      SERVER_SSL_ENABLED: false

      # Nextcloud Integration (Verificador de Imágenes)
      NEXTCLOUD_URL: http://nextcloud_app
      NEXTCLOUD_USERNAME: admin
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_PASSWORD:-}
      NEXTCLOUD_IMAGES_PATH: /Verificador/imagenes/

      # File Upload Settings
      MAX_FILE_SIZE: 10MB
      MAX_REQUEST_SIZE: 10MB

      # Java Options
      JAVA_OPTS: -Xms512m -Xmx1024m

    ports:
      - "8080:8080"

    networks:
      - grupo2-network

    depends_on:
      mariadb:
        condition: service_healthy


volumes:
  db_data:
    driver: local
  nextcloud_data:
    driver: local
  nextcloud_config:
    driver: local

networks:
  grupo2-network:
    driver: bridge
