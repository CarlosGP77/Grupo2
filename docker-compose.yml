
services:
  dns:
    image: jpillora/dnsmasq:latest
    container_name: grupo2-dns
    restart: unless-stopped

    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "8888:8080"

    environment:
      HTTP_USER: admin
      HTTP_PASS: admin

    networks:
      - grupo2-network

    healthcheck:
      test: ["CMD", "nslookup", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mariadb:
    image: mariadb:11
    container_name: grupo2-mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: admin_123
      MARIADB_DATABASE: mourosub
      MARIADB_AUTO_UPGRADE: 1

    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init-nextcloud-db.sql:/docker-entrypoint-initdb.d/init-nextcloud-db.sql:ro

    ports:
      - "3306:3306"

    networks:
      - grupo2-network

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nextcloud:
    image: nextcloud:28
    container_name: grupo2-nextcloud
    restart: unless-stopped

    environment:
      MYSQL_HOST: mariadb
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud_123
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: Admin_123
      NEXTCLOUD_TRUSTED_DOMAINS: 192.168.35.132 localhost

    volumes:
      - nextcloud_data:/var/www/html

    networks:
      - grupo2-network

    depends_on:
      mariadb:
        condition: service_healthy

  reverse-proxy:
    image: nginx:latest
    container_name: grupo2-nginx
    restart: unless-stopped

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

    ports:
      - "80:80"
      - "443:443"

    networks:
      - grupo2-network

    depends_on:
      app:
        condition: service_started
      dns:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: grupo2-app
    restart: unless-stopped

    environment:
      # Database Configuration
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: mourosub
      DB_USERNAME: root
      DB_PASSWORD: admin_123
      JPA_DDL_AUTO: update

      # Server Configuration
      SERVER_PORT: 8081
      SERVER_SSL_ENABLED: false

      # File Upload Settings
      MAX_FILE_SIZE: 10MB
      MAX_REQUEST_SIZE: 10MB
      FILE_STORAGE_PATH: /data/uploads

      # Nextcloud
      NEXTCLOUD_URL: http://nextcloud
      NEXTCLOUD_USERNAME: admin
      NEXTCLOUD_PASSWORD: Admin_123

      # Java Options
      JAVA_OPTS: -Xms512m -Xmx1024m

    ports:
      - "8081:8081"

    volumes:
      - uploads_data:/data/uploads

    networks:
      - grupo2-network

    depends_on:
      mariadb:
        condition: service_healthy
      dns:
        condition: service_started
      nextcloud:
        condition: service_started


volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
  nextcloud_data:
    driver: local

networks:
  grupo2-network:
    driver: bridge
