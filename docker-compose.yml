version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: grupo2_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-admin_123}
      MARIADB_DATABASE: ${DB_NAME:-mourosub}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  app:
    build: .
    container_name: grupo2_app
    depends_on:
      - db
    restart: unless-stopped
    environment:
      # Spring Boot will read these and application.properties has fallbacks
      DB_URL: jdbc:mariadb://db:3306/${DB_NAME:-mourosub}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-admin_123}
    ports:
      # Map container port 8080 to host port 80 so app is reachable at http://localhost/
      - "80:8080"
    volumes:
      - ./:/app:cached

volumes:
  db_data:

