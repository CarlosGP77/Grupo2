version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: grupo2_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-admin_123}
      MARIADB_DATABASE: ${DB_NAME:-mourosub}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-init:
    image: mariadb:10.11
    container_name: grupo2_db_init
    depends_on:
      mariadb:
        condition: service_healthy
    restart: "no"
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-admin_123}
    volumes:
      - ./docker/init-db.sql:/init/init-db.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      mariadb -h mariadb -u root -p"$$DB_PASSWORD" < /init/init-db.sql

  app:
    build: .
    container_name: grupo2_app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-mourosub}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-admin_123}
    volumes:
      - /root/ssl/keystore.p12:/app/keystore.p12
    ports:
      - "443:8080"

volumes:
  db_data:

