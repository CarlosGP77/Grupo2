spring.application.name=Grupo2-BdConSpringBoot

# DOCKER CONFIGURATION
spring.datasource.url=jdbc:mariadb://${DB_HOST:mariadb}:${DB_PORT:3306}/${DB_NAME:mourosub}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin_123}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.defer-datasource-initialization=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Server Configuration
server.port=${SERVER_PORT:8080}
server.ssl.enabled=${SERVER_SSL_ENABLED:false}

# SSL Configuration (if needed)
server.ssl.key-store=${SERVER_KEYSTORE:file:/app/keystore.p12}
server.ssl.key-store-password=${SERVER_KEYSTORE_PASSWORD:Admin_123}
server.ssl.key-store-type=${SERVER_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SERVER_KEY_ALIAS:springboot}

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.example=DEBUG

# File Upload Settings
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Local File Storage Configuration
file.storage.path=${FILE_STORAGE_PATH:/data/uploads}
