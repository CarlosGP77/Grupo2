s# Application Configuration
spring.application.name=Grupo2-BdConSpringBoot

# LOCAL DEVELOPMENT (sin Docker)
spring.datasource.url=jdbc:mariadb://localhost:3306/mourosub
spring.datasource.username=root
spring.datasource.password=admin_123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# DOCKER / PRODUCCIÓN (descomentar si usas Docker Compose)
# spring.datasource.url=jdbc:mariadb://mariadb:3306/mourosub
# spring.datasource.username=root
# spring.datasource.password=admin_123

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Error Handling - DON'T HIDE ERRORS
spring.datasource.continue-on-error=false

# LOCAL DEVELOPMENT
server.port=8080
server.ssl.enabled=false

# DOCKER / PRODUCCIÓN (descomentar si usas Docker)
# server.port=${SERVER_PORT:8081}
# server.ssl.enabled=${SERVER_SSL_ENABLED:false}

server.ssl.key-store=${SERVER_KEYSTORE:file:/app/keystore.p12}
server.ssl.key-store-password=${SERVER_KEYSTORE_PASSWORD:Admin_123}
server.ssl.key-store-type=${SERVER_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SERVER_KEY_ALIAS:springboot}

logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.example=DEBUG
