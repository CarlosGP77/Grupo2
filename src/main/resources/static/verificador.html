<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Imágenes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 1000px; }
        header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 30px; text-align: center; }
        header h1 { font-size: 32px; margin-bottom: 10px; }
        .tabs { display: flex; border-bottom: 2px solid #e5e7eb; background: #f9fafb; }
        .tab-button { flex: 1; padding: 15px; background: none; border: none; cursor: pointer; font-size: 16px; font-weight: 500; color: #6b7280; border-bottom: 3px solid transparent; }
        .tab-button.active { color: #667eea; border-bottom-color: #667eea; background: white; }
        .tab-content { display: none; padding: 30px; }
        .tab-content.active { display: block; }
        .upload-area { border: 3px dashed #667eea; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; background: #f3f4ff; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .image-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; }
        .image-preview { width: 100%; height: 200px; object-fit: cover; }
        .image-info { padding: 15px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; max-width: 600px; width: 100%; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-family: Arial; }
        .alert { padding: 15px; border-radius: 6px; margin-bottom: 20px; display: none; }
        .alert.show { display: block; }
        .alert-success { background: #dcfce7; color: #166534; }
        .alert-error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Verificador de Imágenes</h1>
            <p>Sistema de verificación con Nextcloud</p>
        </header>
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab(event, 'upload')">Subir</button>
            <button class="tab-button" onclick="switchTab(event, 'pending')">Pendientes</button>
            <button class="tab-button" onclick="switchTab(event, 'verified')">Verificadas</button>
            <button class="tab-button" onclick="switchTab(event, 'stats')">Estadisticas</button>
        </div>
        <div id="alert" class="alert"></div>
        <div id="upload" class="tab-content active">
            <div class="upload-area" ondrop="handleDrop(event)" ondragover="event.preventDefault()" onclick="document.getElementById('fileInput').click()">
                <p style="font-size: 48px;">📁</p>
                <p><strong>Arrastra archivos aqui o haz clic</strong></p>
                <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
            </div>
        </div>
        <div id="pending" class="tab-content">
            <h2>Imagenes por Verificar</h2>
            <div id="pendingList" class="image-grid"></div>
        </div>
        <div id="verified" class="tab-content">
            <h2>Imagenes Verificadas</h2>
            <div id="verifiedList" class="image-grid"></div>
        </div>
        <div id="stats" class="tab-content">
            <h2>Estadisticas</h2>
            <div id="statsList"></div>
        </div>
    </div>

    <div id="verifyModal" class="modal">
        <div class="modal-content">
            <h2>Verificar Imagen</h2>
            <div id="modalImagePreview"></div>
            <form onsubmit="submitVerification(event)">
                <div class="form-group">
                    <label>Estado</label>
                    <select id="verifyStatus">
                        <option value="APPROVED">Aprobada</option>
                        <option value="REJECTED">Rechazada</option>
                        <option value="NEEDS_REVISION">Necesita Revision</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Comentarios</label>
                    <textarea id="verifyComment"></textarea>
                </div>
                <div class="form-group">
                    <label>Verificado por</label>
                    <input type="text" id="verifyBy" required>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api/verificador';
        let currentImageId = null;

        function switchTab(event, tabName) {
            document.querySelectorAll('.tab-content').forEach(function(tab) { tab.classList.remove('active'); });
            document.querySelectorAll('.tab-button').forEach(function(btn) { btn.classList.remove('active'); });
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            if (tabName === 'pending') loadPendingImages();
            else if (tabName === 'verified') loadVerifiedImages();
            else if (tabName === 'stats') loadStatistics();
        }

        function handleDrop(e) {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) uploadFile(e.dataTransfer.files[0]);
        }

        function handleFileSelect(e) {
            if (e.target.files.length > 0) uploadFile(e.target.files[0]);
        }

        function uploadFile(file) {
            var formData = new FormData();
            formData.append('file', file);
            fetch(API_BASE + '/upload', { method: 'POST', body: formData })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.id) {
                        showAlert('Imagen subida correctamente', 'success');
                        loadPendingImages();
                    } else showAlert(data.error || 'Error', 'error');
                });
        }

        function loadPendingImages() {
            fetch(API_BASE + '/pendientes')
                .then(function(r) { return r.json(); })
                .then(function(images) { renderImages(images, 'pendingList', true); });
        }

        function loadVerifiedImages() {
            fetch(API_BASE + '/verificadas')
                .then(function(r) { return r.json(); })
                .then(function(images) { renderImages(images, 'verifiedList', false); });
        }

        function renderImages(images, containerId, showVerifyBtn) {
            var container = document.getElementById(containerId);
            var html = '';
            images.forEach(function(img) {
                var btn = showVerifyBtn ? '<button class="btn btn-primary" onclick="openVerifyModal(' + img.id + ')">Verificar</button>' : '';
                html += '<div class="image-card">' +
                    '<img src="' + API_BASE + '/ver/' + img.id + '" class="image-preview">' +
                    '<div class="image-info">' +
                    '<div>' + img.filename + '</div>' +
                    '<div>' + new Date(img.uploadDate).toLocaleDateString() + '</div>' +
                    btn +
                    '<button class="btn btn-danger" onclick="deleteImage(' + img.id + ')">Eliminar</button>' +
                    '</div>' +
                    '</div>';
            });
            container.innerHTML = html;
        }

        function openVerifyModal(id) {
            currentImageId = id;
            document.getElementById('modalImagePreview').innerHTML = '<img src="' + API_BASE + '/ver/' + id + '" style="width: 100%; max-height: 300px;">';
            document.getElementById('verifyModal').classList.add('show');
        }

        function submitVerification(e) {
            e.preventDefault();
            var params = 'status=' + document.getElementById('verifyStatus').value +
                '&comment=' + document.getElementById('verifyComment').value +
                '&verifiedBy=' + document.getElementById('verifyBy').value;
            fetch(API_BASE + '/verificar/' + currentImageId + '?' + params, { method: 'POST' })
                .then(function(r) { return r.json(); })
                .then(function() {
                    showAlert('Imagen verificada', 'success');
                    document.getElementById('verifyModal').classList.remove('show');
                    loadPendingImages();
                });
        }

        function deleteImage(id) {
            if (confirm('Eliminar esta imagen?')) {
                fetch(API_BASE + '/' + id, { method: 'DELETE' })
                    .then(function() {
                        showAlert('Imagen eliminada', 'success');
                        loadPendingImages();
                    });
            }
        }

        function loadStatistics() {
            fetch(API_BASE + '/estadisticas')
                .then(function(r) { return r.json(); })
                .then(function(stats) {
                    var html = '<p>Total: ' + stats.totalImages + '</p>' +
                        '<p>Pendientes: ' + stats.pending + '</p>' +
                        '<p>Aprobadas: ' + stats.approved + '</p>' +
                        '<p>Rechazadas: ' + stats.rejected + '</p>';
                    document.getElementById('statsList').innerHTML = html;
                });
        }

        function showAlert(message, type) {
            var alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = 'alert show alert-' + type;
            setTimeout(function() { alert.classList.remove('show'); }, 5000);
        }
    </script>
</body>
</html>
