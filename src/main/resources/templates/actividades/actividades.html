<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividades</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{src/main/resources/static/styles/actividades.css}">
</head>
<body>
    <main>
        <!-- TÍTULO -->
        <section class="hero py-5">
            <div class="container text-center">
                <h1 class="display-4 mb-3">Explora nuestras actividades</h1>
                <p class="lead">Elige tu aventura submarina.</p>
            </div>
        </section>

        <!-- FILTRO -->
        <section class="filters bg-secondary py-3">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-auto">
                        <div class="d-flex align-items-center">
                            <label for="category" class="me-2 fw-bold">Categoría:</label>
                            <select class="form-select" id="category">
                                <option value="">Todas</option>
                                <option value="Curso">Cursos</option>
                                <option value="Paquete">Paquetes</option>
                                <option value="Actividad">Actividades</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- CARDS -->
        <section class="activity-cards py-5">
            <div class="container">
                <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                    <div class="col" th:each="actividad : ${actividades}">
                        <div class="card h-100">
                            <img th:src="${actividad.imageUrl}" class="card-img-top" alt="Imagen de la actividad">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${actividad.nombre}">Nombre de la Actividad</h5>
                                <p class="card-text" th:text="${actividad.descripcion}">Descripción de la actividad</p>
                                <p class="card-text fw-bold text-primary" th:text="'$' + ${actividad.precio}">Precio</p>
                                <a th:href="@{/actividades/{id}(id=${actividad.id})}" class="btn btn-primary">Más Información</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
