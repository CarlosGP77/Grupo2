<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Usuarios - MouroSubV2</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap"></i> MouroSubV2
            </a>
            <form action="/logout" method="post" class="ms-auto">
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="list-group">
                    <a href="/admin/dashboard" class="list-group-item list-group-item-action">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                    <a href="/admin/users" class="list-group-item list-group-item-action active">
                        <i class="fas fa-users"></i> Usuarios
                    </a>
                    <a href="/admin/courses" class="list-group-item list-group-item-action">
                        <i class="fas fa-book"></i> Cursos
                    </a>
                    <a href="/admin/activities" class="list-group-item list-group-item-action">
                        <i class="fas fa-calendar"></i> Actividades
                    </a>
                    <a href="/admin/locations" class="list-group-item list-group-item-action">
                        <i class="fas fa-map-marker-alt"></i> Ubicaciones
                    </a>
                </div>
            </div>

            <div class="col-md-9">
                <h2>Gestión de Usuarios</h2>
                <table class="table table-striped mt-4">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Email</th>
                            <th>Nombre Completo</th>
                            <th>Rol</th>
                            <th>Verificación</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.username}"></td>
                            <td th:text="${user.email}"></td>
                            <td th:text="${user.fullName}"></td>
                            <td>
                                <span class="badge" th:classappend="${user.role.name() == 'ADMIN' ? 'bg-danger' : user.role.name() == 'VERIFICADOR' ? 'bg-warning' : 'bg-info'}" th:text="${user.role.description}"></span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${user.verificationStatus.name() == 'VERIFIED' ? 'bg-success' : user.verificationStatus.name() == 'PENDING' ? 'bg-warning' : 'bg-danger'}" th:text="${user.verificationStatus.description}"></span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${user.enabled} ? 'bg-success' : 'bg-secondary'" th:text="${user.enabled ? 'Activo' : 'Inactivo'}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
