<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-3">Ha ocurrido un error</h1>
            <p class="mb-2" th:if="${status != null}">Código: <strong th:text="${status}">500</strong></p>
            <p class="mb-2" th:if="${error != null and !#strings.isEmpty(error)}">Error: <strong th:text="${error}">Error</strong></p>
            <p class="mb-3" th:if="${message != null and !#strings.isEmpty(message)}">Mensaje: <span th:text="${message}">Mensaje</span></p>
            <p class="text-muted mb-0">Vuelve al inicio e inténtalo de nuevo.</p>
            <a class="btn btn-primary mt-3" th:href="@{/}">Ir al inicio</a>
        </div>
    </div>
</main>
</body>
</html>
