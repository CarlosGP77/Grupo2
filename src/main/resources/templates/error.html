<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ruta no encontrada</title>
</head>
<body>
<h1>Página no encontrada</h1>

<p th:if="${status != null}">Código: <span th:text="${status}">404</span></p>
<p th:if="${error != null}">Error: <span th:text="${error}">Not Found</span></p>
<p th:if="${path != null}">Ruta: <span th:text="${path}">/ruta</span></p>
<p th:if="${message != null}">Mensaje: <span th:text="${message}">No existe</span></p>

<p>Para probar la aplicación sin estilos entra en <a href="/simple">/simple</a>.</p>
</body>
</html>
