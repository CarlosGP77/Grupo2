<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <!-- El título cambia dinámicamente según si el usuario ya existe o es nuevo.
         Si usaux.id tiene valor → "Editar Usuario", si es null → "Crear Usuario" -->
    <h2 class="mb-4" th:text="${usaux.id != null} ? 'Editar Usuario' : 'Crear Usuario'"></h2>

    <!-- th:action genera la URL del destino del formulario (/guardarusuario).
         th:object vincula este formulario al objeto "usaux" del modelo; -->
    <form th:action="@{/guardarusuario}" method="post" th:object="${usaux}" class="card p-4 shadow">

        <!-- Campo oculto que transporta el id del usuario al controlador.
             si viene vacío, crea uno nuevo. -->
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <!-- th:field="*{nombre}" hace dos cosas:
                 1. Rellena el value del input con usaux.getNombre().
                 2. Asigna el name="nombre" para que Spring lo mapee al objeto al recibir el POST. -->
            <input type="text" th:field="*{nombre}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <!-- Mismo comportamiento que el campo nombre.
                 type="email" activa la validación de formato del navegador. -->
            <input type="email" th:field="*{email}" class="form-control" required>
        </div>

        <div class="d-flex justify-content-between">
            <!-- Botón de cancelar: vuelve al listado sin guardar nada -->
            <a href="/listausuarios" class="btn btn-secondary">Volver</a>
            <!-- Botón de envío: dispara el POST a /guardarusuario -->
            <button type="submit" class="btn btn-primary">Guardar</button>
        </div>

    </form>
</div>
</body>
</html>
