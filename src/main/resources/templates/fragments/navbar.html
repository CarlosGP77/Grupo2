<!DOCTYPE html>
<!-- Fragment: Navbar común -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><img th:src="@{/img/LOGO.webp}" alt="Mourosub"></a>

        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/actividades}" href="/actividades">Actividades</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/otros}" href="/otros">Otros</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/ubicaciones}" href="/ubicaciones">Ubicaciones</a></li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <a class="login-btn text-decoration-none" th:if="${!usuarioAutenticado}" th:href="@{/login}">Iniciar sesión</a>
                <div class="dropdown" th:if="${usuarioAutenticado}">
                    <button class="login-btn dropdown-toggle d-flex align-items-center gap-2" type="button"
                            id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle"></i>
                        <span th:text="${nombreUsuario}"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li>
                            <a class="dropdown-item" th:href="@{/info-usuario}">
                                <i class="bi bi-person-lines-fill me-2"></i>Ver información de usuario
                            </a>
                        </li>
                        <li th:if="${usuarioEsAdmin}"><a class="dropdown-item" th:href="@{/admin/panel}">Panel Admin</a></li>
                        <li th:if="${usuarioEsAdmin or usuarioEsVerificador}"><a class="dropdown-item" th:href="@{/verificador/panel}">Panel Verificador</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="dropdown-item">Cerrar sesión</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>
