<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${actividad.nombre}">Detalle Actividad</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/common.css}">
</head>

<body class="theme-dark">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="pt-5 mt-5">

    <!-- HERO -->
    <section class="container py-4">
        <div class="row g-4">

            <!-- Imagen principal -->
            <div class="col-lg-8">
                <img th:src="@{/img/actividades/{id}.webp(id=${actividad.id_actividad})}" class="img-fluid rounded shadow w-75" alt="Imagen actividad">
            </div>

            <!-- Panel de reserva -->
            <div class="col-lg-4">
                <div class="p-4 rounded shadow bg-surface">

                    <h2 class="mb-3" th:text="${actividad.nombre}">Nombre</h2>

                        <p class="fs-4 fw-bold text-primary">
                        € <span th:text="${actividad.precio}">0</span> / persona
                    </p>

                    <p class="text-warning fw-bold">Alta demanda</p>

                    <form th:action="@{'/actividades/' + ${actividad.id_actividad} + '/reservar'}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-primary w-100">Reservar ahora</button>
                    </form>

                    <p class="small mt-3 text-muted">
                        Cancelación gratuita hasta 48h antes
                    </p>
                </div>
            </div>

        </div>
    </section>

    <!-- DESCRIPCIÓN -->
    <section class="container py-4">
        <h3>Descripción</h3>
        <p th:text="${actividad.descripcion}">
            Texto de descripción
        </p>
    </section>
</main>

    <footer class="py-4 text-center">
    <p>© 2026 Mourosub</p>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
