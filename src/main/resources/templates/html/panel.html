<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de VerificaciÃ³n</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/modern.css}">
    <link rel="stylesheet" th:href="@{/styles/common.css}">
    <link rel="stylesheet" th:href="@{/styles/panel.css}">
    <style>
        body { padding: 24px; }
        .usuario-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .badge-danger { background-color: #dc3545 !important; }
        .badge-warning { background-color: #ffc107 !important; color: #000 !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Panel de VerificaciÃ³n de Credenciales</h1>
        <a th:href="@{/}" class="btn btn-secondary mb-3">â† Volver al inicio</a>
        <h3>Usuarios sin Verificar</h3>
        <div th:if="${usuariosNoVerificados.size() > 0}">
            <div th:each="u : ${usuariosNoVerificados}" class="usuario-card">
                <div class="row">
                    <div class="col-md-8">
                        <h5 th:text="${u.nombre_completo}"></h5>
                        <p class="mb-1"><strong>DNI:</strong> <span th:text="${u.dni}"></span></p>
                        <p class="mb-1"><strong>Email:</strong> <span th:text="${u.email}"></span></p>
                        <p class="mb-1"><strong>Licencia:</strong> <span th:text="${u.licencia}"></span></p>
                        <p class="mb-1"><strong>Titulaciones:</strong> <span th:text="${u.titulaciones ?: 'No especificadas'}"></span></p>
                        <p class="mb-0"><strong>Estado de VerificaciÃ³n:</strong> <span style="color: red;">âœ— No Verificado</span></p>
                    </div>
                    <div class="col-md-4">
                        <form method="POST" action="/verificador/cambiar-verificacion" class="d-inline">
                            <input type="hidden" name="dni" th:value="${u.dni}">
                            <input type="hidden" name="verificado" value="true">
                            <button type="submit" class="btn btn-success btn-sm w-100 mb-2">âœ“ Verificar Usuario</button>
                        </form>
                        <a th:href="@{/verificador/usuario(dni=${u.dni})}" class="btn btn-info btn-sm w-100">MÃ¡s detalles</a>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${usuariosNoVerificados.size() == 0}" class="alert alert-success">
            âœ“ Todos los usuarios han sido verificados
        </div>

        <hr>
        <h3 class="mt-5">Usuarios Verificados</h3>
        <table class="table table-striped">
            <thead class="table-light">
                <tr>
                    <th>DNI</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- AquÃ­ irÃ­an los usuarios verificados (no lo implementÃ© en el controlador, pero puedes agregarlo) -->
            </tbody>
        </table>
    </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        </body>
</html>
