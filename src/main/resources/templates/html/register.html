<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mourosub - Crear cuenta</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/styles/modern.css}">
    <link rel="stylesheet" th:href="@{/styles/login.css}">
</head>
<body class="min-h-screen flex items-center justify-center font-body-md text-body-md">
<div class="flex w-full min-h-screen bg-surface md:flex-row flex-col">
    <div class="relative hidden md:flex w-1/2 bg-surface-container-low items-center justify-center overflow-hidden">
        <img alt="Scuba Diver" class="absolute inset-0 w-full h-full object-cover opacity-60" th:src="@{/img/img-log.webp}"/>
        <div class="absolute inset-0 bg-gradient-to-t from-surface-container-low/90 to-transparent"></div>
        <div class="relative z-10 px-xl max-w-lg text-center backdrop-blur-md bg-surface/15 border border-white/10 rounded-xl p-lg shadow-sm">
            <h1 class="font-display-lg text-display-lg text-on-surface mb-base tracking-tighter">Mourosub</h1>
            <p class="font-headline-md text-headline-md text-primary font-light mb-md">"Explora, aprende y consigue tu cuenta para gestionar tus inmersiones."</p>
            <p class="font-body-md text-body-md text-on-surface-variant">Registro de usuario</p>
        </div>
    </div>
    <div class="w-full md:w-1/2 flex flex-col justify-center px-gutter md:px-xl py-xl bg-surface">
        <div class="max-w-md mx-auto w-full">
            <div class="md:hidden text-center mb-lg">
                <h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-tighter">Mourosub</h1>
            </div>
            <div class="mb-lg">
                <h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Crear cuenta</h2>
                <p class="font-body-lg text-body-lg text-on-surface-variant">Rellena tus datos y deja la titulación indicada si quieres que se revise.</p>
            </div>
            <div th:if="${error}" class="mb-md rounded-lg border border-red-500/30 bg-red-500/10 px-md py-sm text-red-200" th:text="${error}"></div>
            <form method="post" th:action="@{/register}" class="space-y-md" th:object="${usuario}">
                <!-- Token CSRF necesario para solicitudes POST cuando Spring Security está habilitado -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div>
                    <label class="block font-label-md text-label-md text-on-surface mb-xs" for="dni">DNI</label>
                    <input id="dni" th:field="*{dni}" type="text" required class="w-full bg-surface-container-highest border border-outline-variant text-on-surface rounded-lg py-sm px-sm focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" placeholder="12345678A"/>
                </div>
                <div>
                    <label class="block font-label-md text-label-md text-on-surface mb-xs" for="nombre_completo">Nombre completo</label>
                    <input id="nombre_completo" th:field="*{nombre_completo}" type="text" required class="w-full bg-surface-container-highest border border-outline-variant text-on-surface rounded-lg py-sm px-sm focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" placeholder="Tu nombre y apellidos"/>
                </div>
                <div>
                    <label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Correo electrónico</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-sm"><span class="material-symbols-outlined text-outline">mail</span></span>
                        <input id="email" th:field="*{email}" type="email" required class="w-full bg-surface-container-highest border border-outline-variant text-on-surface rounded-lg py-sm pl-lg pr-sm focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" placeholder="tu@email.com"/>
                    </div>
                </div>
                <div>
                    <label class="block font-label-md text-label-md text-on-surface mb-xs" for="titulaciones">Titulaciones</label>
                    <textarea id="titulaciones" th:field="*{titulaciones}" rows="4" class="w-full bg-surface-container-highest border border-outline-variant text-on-surface rounded-lg py-sm px-sm focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" placeholder="Escribe aquí tu titulación si quieres que la revisen"></textarea>
                </div>
                <div>
                    <label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-sm"><span class="material-symbols-outlined text-outline">lock</span></span>
                        <input id="password" name="password" type="password" required class="w-full bg-surface-container-highest border border-outline-variant text-on-surface rounded-lg py-sm pl-lg pr-sm focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" placeholder="••••••••"/>
                    </div>
                </div>
                <div>
                    <label class="block font-label-md text-label-md text-on-surface mb-xs" for="confirmPassword">Confirmar contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-sm"><span class="material-symbols-outlined text-outline">lock</span></span>
                        <input id="confirmPassword" name="confirmPassword" type="password" required class="w-full bg-surface-container-highest border border-outline-variant text-on-surface rounded-lg py-sm pl-lg pr-sm focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" placeholder="••••••••"/>
                    </div>
                </div>
                <button type="submit" class="w-full bg-tertiary-container hover:bg-tertiary-container/90 text-on-surface font-label-md text-label-md py-sm rounded-lg transition-colors flex justify-center items-center gap-xs">
                    Crear cuenta
                    <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">person_add</span>
                </button>
            </form>
            <div class="mt-lg text-center">
                <p class="font-body-md text-body-md text-on-surface-variant mb-sm">¿Ya tienes cuenta?</p>
                <a th:href="@{/login}" class="inline-flex items-center justify-center w-full rounded-lg border border-outline-variant px-md py-sm text-on-surface font-label-md text-label-md hover:border-secondary hover:text-secondary transition-colors">
                    Volver al login
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
