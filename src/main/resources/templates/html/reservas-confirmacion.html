<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reserva confirmada</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/common.css}">
</head>

<body class="theme-dark">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Mourosub</a>
    </div>
</nav>

<main class="pt-5 mt-5">

    <!-- HERO -->
    <section class="container text-center py-5">
        <h1 class="fw-bold text-success">¡Reserva confirmada!</h1>
        <p class="lead mt-3">
            Tu aventura submarina ya está lista.
            Hemos registrado tu reserva correctamente.
        </p>

        <img src="/img/check.webp" alt="Reserva confirmada"
             class="img-fluid my-4" style="max-width: 180px;">
    </section>

    <!-- DETALLES DE LA RESERVA -->
    <section class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-6">

                <div class="p-4 rounded shadow bg-surface">

                    <h3 class="mb-3">Detalles de tu reserva</h3>

                    <ul class="list-group list-group-flush">

                        <li class="list-group-item bg-surface">
                            <strong>Actividad:</strong>
                            <span th:text="${actividad != null ? actividad.nombre : '—'}">—</span>
                        </li>

                        <li class="list-group-item bg-surface">
                            <strong>Precio:</strong>
                            € <span th:text="${precio != null ? precio : '—'}">—</span>
                        </li>

                        <li class="list-group-item bg-surface">
                            <strong>Ubicación:</strong>
                            <span th:text="${ubicacion != null ? ubicacion.nombre : '—'}">—</span>
                        </li>

                        <li class="list-group-item bg-surface">
                            <strong>Fecha de inicio:</strong>
                            <span th:text="${fechaInicio != null ? fechaInicio : '—'}">—</span>
                        </li>

                    </ul>

                    <div class="mt-4 text-center">
                        <a th:href="@{/}" class="btn btn-primary px-4">Volver al inicio</a>
                    </div>

                </div>

            </div>
        </div>
    </section>

</main>

<footer class="py-4 text-center">
    <p>© 2026 Mourosub</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
