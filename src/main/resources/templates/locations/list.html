<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicaciones - MouroSubV2</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f7fa;
        }
        .location-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .location-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">MouroSubV2</a>
            <form action="/logout" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Ubicaciones Disponibles</h2>
        <p class="text-muted">Descubre nuestras sedes y espacios</p>

        <div class="row mt-4">
            <div th:each="location : ${locations}" class="col-md-4 mb-4">
                <div class="card location-card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${location.name}">Ubicación</h5>
                        <p class="card-text" th:text="${location.description}">Descripción</p>

                        <div class="mb-3">
                            <small class="d-block text-muted">
                                <i class="fas fa-map-marker-alt"></i>
                                <span th:text="${location.address + ', ' + location.city}">Dirección</span>
                            </small>
                            <small class="d-block text-muted">
                                <i class="fas fa-id-card"></i>
                                <span th:text="${'CP: ' + location.postalCode}">Código Postal</span>
                            </small>
                            <small class="d-block text-muted">
                                <i class="fas fa-users"></i>
                                <span th:text="${'Capacidad: ' + location.capacity}">Capacidad</span>
                            </small>
                        </div>

                        <a th:href="${'/locations/' + location.id}" class="btn btn-primary btn-sm">
                            <i class="fas fa-eye"></i> Ver Detalles
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(locations)}" class="alert alert-info">
            <i class="fas fa-info-circle"></i> No hay ubicaciones disponibles.
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
