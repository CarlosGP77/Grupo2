<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Mourosub - Login</title>
    <script th:src="@{/js/login.js}"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/styles/login.css}">
</head>
<body class="min-h-screen flex items-center justify-center font-body-md text-body-md">
<div class="flex w-full min-h-screen bg-surface md:flex-row flex-col">
    <!-- Left Side: Image/Quote -->
    <div class="relative hidden md:flex w-1/2 bg-surface-container-low items-center justify-center overflow-hidden">
        <img alt="Scuba Diver" class="absolute inset-0 w-full h-full object-cover opacity-60" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA4ez0pksRKvM93kbNkZVNLT0e_u0U1hxjgXKur-sFUbDX9nguAeasgHXX9vaVhfUbzi4u9HuzpS4BWHXOCUUD8YUKKfFcWj0kN5s4BYYWuyPpTc0fzeAZlsy8t1mglUMxtSn6TtnzUTGGiRKMufSXEcEyewt1Q3j1lSv0hkK9p2nX7feOR6XRBB2xsKSSErgAdKNNlWbEYEIDdVUXWPgtxiClCor4lYz-uzCyZ2FBKdbEsT9dCGe12pl5udwukjaP8sHt704MA3Rk"/>
        <div class="absolute inset-0 bg-gradient-to-t from-surface-container-low/90 to-transparent"></div>
        <div class="relative z-10 px-xl max-w-lg text-center backdrop-blur-md bg-surface/15 border border-white/10 rounded-xl p-lg shadow-sm">
            <h1 class="font-display-lg text-display-lg text-on-surface mb-base tracking-tighter">Mourosub</h1>
            <p class="font-headline-md text-headline-md text-primary font-light mb-md">"El mar, una vez lanza su hechizo, te mantiene en su red de maravillas por siempre."</p>
            <p class="font-body-md text-body-md text-on-surface-variant">- Jacques Cousteau</p>
        </div>
    </div>

    <!-- Right Side: Login Form -->
    <div class="w-full md:w-1/2 flex flex-col justify-center px-gutter md:px-xl py-xl bg-surface">
        <div class="max-w-md mx-auto w-full">
            <!-- Mobile Header (Hidden on Desktop) -->
            <div class="md:hidden text-center mb-lg">
                <h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-tighter">Mourosub</h1>
            </div>
            <div class="mb-lg">
                <h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Bienvenido</h2>
                <p class="font-body-lg text-body-lg text-on-surface-variant">Ingresa tus credenciales para acceder a tu cuenta.</p>
            </div>

            <form method="post" action="/login" class="space-y-md">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Email/DNI Input -->
                <div>
                    <label class="block font-label-md text-label-md text-on-surface mb-xs" for="username">DNI / Usuario</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-sm">
                            <span class="material-symbols-outlined text-outline">person</span>
                        </span>
                        <input class="w-full bg-surface-container-highest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg py-sm pl-lg pr-sm focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="username" name="username" placeholder="Tu DNI o usuario" type="text" required/>
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <div class="flex justify-between items-center mb-xs">
                        <label class="block font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
                        <a class="font-label-md text-label-md text-primary hover:text-secondary transition-colors" href="#">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-sm">
                            <span class="material-symbols-outlined text-outline">lock</span>
                        </span>
                        <input class="w-full bg-surface-container-highest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg py-sm pl-lg pr-sm focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="password" name="password" placeholder="••••••••" type="password" required/>
                    </div>
                </div>

                <!-- Submit Button -->
                <button class="w-full bg-tertiary-container hover:bg-tertiary-container/90 text-on-surface font-label-md text-label-md py-sm rounded-lg transition-colors flex justify-center items-center gap-xs" type="submit">
                    Iniciar Sesión
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">login</span>
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
