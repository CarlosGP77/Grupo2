<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Titulaciones - MouroSubV2</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">MouroSubV2</a>
            <form action="/logout" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Mis Titulaciones</h2>
        <p class="text-muted">Gestiona tus titulaciones y cualificaciones</p>

        <a href="/user/add-qualification" class="btn btn-success mb-3">
            <i class="fas fa-plus"></i> Añadir Titulación
        </a>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Institución</th>
                    <th>Fecha de Expedición</th>
                    <th>Verificada</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="qualification : ${qualifications}">
                    <td th:text="${qualification.title}">Título</td>
                    <td th:text="${qualification.issuer}">Institución</td>
                    <td th:text="${#temporals.format(qualification.issueDate, 'dd/MM/yyyy')}">Fecha</td>
                    <td>
                        <span class="badge" th:classappend="${qualification.verified} ? 'bg-success' : 'bg-warning'"
                              th:text="${qualification.verified ? 'Verificada' : 'Pendiente'}"></span>
                    </td>
                    <td>
                        <form method="post" th:action="${'/qualifications/' + qualification.id + '/delete'}" style="display: inline;">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Estás seguro?')">
                                <i class="fas fa-trash"></i> Eliminar
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(qualifications)}" class="alert alert-info">
            <i class="fas fa-info-circle"></i> No tienes titulaciones registradas aún.
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
