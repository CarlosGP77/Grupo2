<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas - MouroSubV2</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">MouroSubV2</a>
            <form action="/logout" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Mis Reservas</h2>
        <p class="text-muted">Gestiona tus reservas de actividades</p>

        <table class="table table-striped mt-4">
            <thead>
                <tr>
                    <th>Actividad</th>
                    <th>Curso</th>
                    <th>Fecha</th>
                    <th>Ubicación</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="reservation : ${reservations}">
                    <td th:text="${reservation.activity.name}">Actividad</td>
                    <td th:text="${reservation.activity.course.name}">Curso</td>
                    <td th:text="${#temporals.format(reservation.activity.startDate, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                    <td th:text="${reservation.activity.location.name}">Ubicación</td>
                    <td>
                        <span class="badge" th:classappend="${reservation.confirmed} ? 'bg-success' : 'bg-warning'"
                              th:text="${reservation.confirmed ? 'Confirmada' : 'Pendiente'}"></span>
                    </td>
                    <td>
                        <form method="post" th:action="${'/reservations/' + reservation.id + '/cancel'}" style="display: inline;">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Estás seguro?')">
                                <i class="fas fa-trash"></i> Cancelar
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(reservations)}" class="alert alert-info">
            <i class="fas fa-info-circle"></i> No tienes reservas aún.
            <a href="/activities">Ver actividades disponibles</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
