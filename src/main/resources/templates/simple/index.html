<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservas</title>
</head>
<body>
<p th:if="${creada != null}">Reserva creada correctamente.</p>
<p th:if="${error != null}">No se pudo crear la reserva. Revisa los datos.</p>

<h2>Crear reserva</h2>
<form method="post" action="/simple/reservas">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div>
        <label for="usuario_id">Usuario</label>
        <select id="usuario_id" name="usuario_id" required>
            <option value="">-- elige un usuario --</option>
            <option th:each="u : ${usuarios}" th:value="${u.id_usuario}" th:text="${u.id_usuario + ' - ' + u.dni + ' - ' + u.nombre_completo}"></option>
        </select>
    </div>

    <div>
        <label for="actividad_id">Actividad</label>
        <select id="actividad_id" name="actividad_id" required>
            <option value="">-- elige una actividad --</option>
            <option th:each="a : ${actividades}" th:value="${a.id_actividad}" th:text="${a.id_actividad + ' - ' + a.nombre}"></option>
        </select>
    </div>

    <div>
        <label for="ubicacion_id">Ubicación</label>
        <select id="ubicacion_id" name="ubicacion_id" required>
            <option value="">-- elige una ubicación --</option>
            <option th:each="u : ${ubicaciones}" th:value="${u.id_ubicacion}" th:text="${u.id_ubicacion + ' - ' + u.nombre}"></option>
        </select>
    </div>

    <button type="submit">Crear reserva</button>
</form>

<h2>Usuarios</h2>
<ul>
    <li th:each="u : ${usuarios}" th:text="${u.id_usuario + ' - ' + u.dni + ' - ' + u.nombre_completo}">Usuario</li>
</ul>

<h2>Actividades</h2>
<ul>
    <li th:each="a : ${actividades}" th:text="${a.id_actividad + ' - ' + a.nombre + ' - ' + (a.precio != null ? a.precio : 'sin precio')}">Actividad</li>
</ul>

<h2>Ubicaciones</h2>
<ul>
    <li th:each="u : ${ubicaciones}" th:text="${u.id_ubicacion + ' - ' + u.nombre}">Ubicación</li>
</ul>

<h2>Reservas existentes</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Actividad</th>
        <th>Ubicación</th>
        <th>Precio</th>
        <th>Inicio</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${reservas}">
        <td th:text="${r.id_reserva}">1</td>
        <td th:text="${r.usuario != null ? r.usuario.dni : 'N/A'}">Usuario</td>
        <td th:text="${r.actividad != null ? r.actividad.nombre : 'N/A'}">Actividad</td>
        <td th:text="${r.ubicacion != null ? r.ubicacion.nombre : 'N/A'}">Ubicación</td>
        <td th:text="${r.precio != null ? r.precio : 'N/A'}">Precio</td>
        <td th:text="${r.fecha_inicio != null ? r.fecha_inicio : 'N/A'}">Fecha</td>
    </tr>
    </tbody>
</table>

<p>
    <a href="/">HOME</a> |
    <a href="/simple">F5</a>
</p>
</body>
</html>
