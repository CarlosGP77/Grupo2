<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir Titulación - MouroSubV2</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f7fa;
        }
        .form-container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">MouroSubV2</a>
            <form action="/logout" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <div class="form-container">
        <h2 class="mb-4">
            <i class="fas fa-certificate"></i> Añadir Titulación
        </h2>
        <p class="text-muted">Registra tus titulaciones para verificación</p>
        <hr>

        <form method="post" action="/user/add-qualification">
            <div class="mb-3">
                <label for="title" class="form-label">Título de la Titulación</label>
                <input type="text" class="form-control" id="title" name="title"
                       placeholder="Ej: Licenciatura en Informática" required>
            </div>

            <div class="mb-3">
                <label for="issuer" class="form-label">Institución/Universidad</label>
                <input type="text" class="form-control" id="issuer" name="issuer"
                       placeholder="Ej: Universidad de Madrid" required>
            </div>

            <div class="mb-3">
                <label for="issueDate" class="form-label">Fecha de Expedición</label>
                <input type="date" class="form-control" id="issueDate" name="issueDate" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Descripción (Opcional)</label>
                <textarea class="form-control" id="description" name="description"
                          rows="3" placeholder="Información adicional sobre la titulación"></textarea>
            </div>

            <button type="submit" class="btn btn-success w-100">
                <i class="fas fa-save"></i> Guardar Titulación
            </button>
            <a href="/user/dashboard" class="btn btn-outline-secondary w-100 mt-2">
                <i class="fas fa-times"></i> Cancelar
            </a>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
