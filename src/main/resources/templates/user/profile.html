<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - MouroSubV2</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">MouroSubV2</a>
            <form action="/logout" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-user-circle"></i> Mi Perfil
                        </h4>
                    </div>
                    <div class="card-body">
                        <table class="table table-borderless">
                            <tr>
                                <td><strong>Nombre:</strong></td>
                                <td th:text="${user.firstName}">Nombre</td>
                            </tr>
                            <tr>
                                <td><strong>Apellido:</strong></td>
                                <td th:text="${user.lastName}">Apellido</td>
                            </tr>
                            <tr>
                                <td><strong>Usuario:</strong></td>
                                <td th:text="${user.username}">Usuario</td>
                            </tr>
                            <tr>
                                <td><strong>Email:</strong></td>
                                <td th:text="${user.email}">Email</td>
                            </tr>
                            <tr>
                                <td><strong>Rol:</strong></td>
                                <td>
                                    <span class="badge bg-info" th:text="${user.role.description}">Rol</span>
                                </td>
                            </tr>
                            <tr>
                                <td><strong>Estado de Verificación:</strong></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${user.verificationStatus.name() == 'VERIFIED' ? 'bg-success' : user.verificationStatus.name() == 'PENDING' ? 'bg-warning' : 'bg-danger'}"
                                          th:text="${user.verificationStatus.description}">Estado</span>
                                </td>
                            </tr>
                            <tr>
                                <td><strong>Cuenta Activa:</strong></td>
                                <td>
                                    <span class="badge" th:classappend="${user.enabled} ? 'bg-success' : 'bg-danger'"
                                          th:text="${user.enabled ? 'Sí' : 'No'}">Activa</span>
                                </td>
                            </tr>
                            <tr>
                                <td><strong>Fecha de Registro:</strong></td>
                                <td th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                            </tr>
                        </table>
                    </div>
                </div>

                <div class="mt-4">
                    <a href="/user/dashboard" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i> Volver al Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
