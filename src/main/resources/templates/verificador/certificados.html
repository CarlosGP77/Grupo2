<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Certificados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/common.css}">
    <link rel="stylesheet" th:href="@{/styles/modern.css}">
    <style>
        body { background: var(--color-background); color: var(--color-on-surface); }
        h1, h2, h3, h4, h5, h6, p, strong, small, label, span {
            color: var(--color-on-surface);
        }
        .text-muted {
            color: rgba(232, 236, 255, 0.72) !important;
        }
        .certificado-card {
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.04);
            padding: 20px;
            margin: 15px 0;
            border-radius: 16px;
            transition: all 0.3s ease;
        }
        .certificado-card:hover {
            background: rgba(255,255,255,.08);
            border-color: rgba(255,255,255,.2);
        }
        .usuario-badge {
            background: rgba(44, 125, 255, 0.14);
            color: #a6ccff;
            border: 1px solid rgba(44, 125, 255, 0.22);
            border-radius: 999px;
            padding: 0.5rem 1rem;
            font-weight: 600;
        }
        .certificados-count {
            background: rgba(255, 184, 171, 0.14);
            color: #ffb4ab;
            border: 1px solid rgba(255, 184, 171, 0.22);
            border-radius: 999px;
            padding: 0.5rem 1rem;
            font-weight: 600;
        }
        .card-title {
            color: var(--color-on-surface);
        }
        .card-text {
            color: #ffffff !important;
        }
        .usuario-link {
            min-width: 170px;
        }
    </style>
</head>
<body style="min-height: 100vh;">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container" style="margin-top: 100px; margin-bottom: 50px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-2"><i class="bi bi-file-check me-2"></i>Verificación de Certificados</h1>
            <p class="text-muted mb-0">Revisa y verifica los certificados subidos por los usuarios</p>
        </div>
        <a th:href="@{/}" class="btn btn-secondary">← Volver</a>
    </div>

    <div class="alert alert-info mb-4" th:if="${totalUsuarios == 0}">
        <i class="bi bi-info-circle me-2"></i>
        No hay certificados pendientes de verificación en este momento.
    </div>

    <div th:if="${totalUsuarios > 0}" class="row mb-4">
        <div class="col-md-6">
            <div class="card bg-dark border-secondary">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-people-fill fs-1 text-primary me-3"></i>
                        <div>
                            <p class="card-text text-muted mb-1">Usuarios con certificados</p>
                            <h3 class="card-title mb-0" th:text="${totalUsuarios}">0</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card bg-dark border-secondary">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-file-earmark-check fs-1 text-warning me-3"></i>
                        <div>
                            <p class="card-text text-muted mb-1">Certificados pendientes</p>
                            <h3 class="card-title mb-0" th:text="${totalCertificados}">0</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:each="entry : ${certificadosPorUsuario.entrySet()}" class="certificado-card">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h5 class="mb-2" th:text="${entry.key.nombre_completo}">Nombre Usuario</h5>
                <p class="mb-1"><strong>DNI:</strong> <span th:text="${entry.key.dni}">DNI</span></p>
                <p class="mb-1"><strong>Email:</strong> <span th:text="${entry.key.email}">Email</span></p>
                <p class="mb-0">
                    <span class="certificados-count" th:text="${#lists.size(entry.value)} + ' certificado(s) pendiente(s)'">
                        0 certificados
                    </span>
                </p>
            </div>
            <div class="col-md-4 text-end">
                <a th:href="@{/verificador/certificados/usuario/{dni}(dni=${entry.key.dni})}"
                   class="btn btn-primary usuario-link">
                    <i class="bi bi-eye me-2"></i>Ver certificados
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
