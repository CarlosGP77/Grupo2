<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Verificación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/common.css}">
    <link rel="stylesheet" th:href="@{/styles/modern.css}">
    <style>
        /* Use global color variables so background is the requested blue */
        body { background: var(--color-background); color: var(--color-on-surface); }
        .usuario-card { border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); padding: 15px; margin: 10px 0; border-radius: 12px; }
    </style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container" style="margin-top: 100px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">Panel de Verificación</h1>
            <p class="text-light mb-0">Solo usuarios con titulaciones indicadas y todavía sin verificar.</p>
        </div>
        <a th:href="@{/}" class="btn btn-secondary">← Volver al inicio</a>
    </div>

    <div class="alert alert-info" th:if="${totalNoVerificados == 0}">
        No hay usuarios pendientes de verificación con titulación informada.
    </div>

    <div th:if="${totalNoVerificados > 0}">
        <div th:each="u : ${usuariosNoVerificados}" class="usuario-card">
            <div class="row g-3 align-items-center">
                <div class="col-md-8">
                    <h5 th:text="${u.nombre_completo}"></h5>
                    <p class="mb-1"><strong>DNI:</strong> <span th:text="${u.dni}"></span></p>
                    <p class="mb-1"><strong>Email:</strong> <span th:text="${u.email}"></span></p>
                    <p class="mb-1"><strong>Licencia:</strong> <span th:text="${u.licencia ?: 'No indicada'}"></span></p>
                    <p class="mb-1"><strong>Titulaciones:</strong> <span th:text="${u.titulaciones}"></span></p>
                    <p class="mb-0 text-warning fw-bold">Pendiente de verificar</p>
                </div>
                <div class="col-md-4">
                    <form method="POST" action="/verificador/cambiar-verificacion" class="d-grid gap-2">
                        <input type="hidden" name="dni" th:value="${u.dni}">
                        <input type="hidden" name="verificado" value="true">
                        <button type="submit" class="btn btn-success">Verificar usuario</button>
                        <a th:href="@{/verificador/usuario(dni=${u.dni})}" class="btn btn-outline-info">Más detalles</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
