<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titulaciones a Verificar - MouroSubV2</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">MouroSubV2</a>
            <form action="/logout" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Titulaciones Pendientes de Verificación</h2>
        <p class="text-muted">Verifica titulaciones de usuarios</p>

        <div th:if="${not #lists.isEmpty(qualifications)}" class="row mt-4">
            <div th:each="qualification : ${qualifications}" class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${qualification.title}">Título</h5>
                        <p class="text-muted" th:text="${'Usuario: ' + qualification.user.fullName}">Usuario</p>

                        <table class="table table-borderless mb-3">
                            <tr>
                                <td><strong>Institución:</strong></td>
                                <td th:text="${qualification.issuer}">Institución</td>
                            </tr>
                            <tr>
                                <td><strong>Fecha:</strong></td>
                                <td th:text="${#temporals.format(qualification.issueDate, 'dd/MM/yyyy')}">Fecha</td>
                            </tr>
                            <tr>
                                <td><strong>Descripción:</strong></td>
                                <td th:text="${qualification.description ?: 'Sin descripción'}">Descripción</td>
                            </tr>
                        </table>

                        <form method="post" th:action="${'/verificador/qualification/' + qualification.id + '/verify'}">
                            <button type="submit" class="btn btn-success btn-sm w-100">
                                <i class="fas fa-check"></i> Verificar
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(qualifications)}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> No hay titulaciones pendientes de verificación.
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
