<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Usuario - MouroSubV2</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">MouroSubV2</a>
            <form action="/logout" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-user-circle"></i> <span th:text="${user.fullName}">Usuario</span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <h5>Información Personal</h5>
                        <table class="table table-borderless">
                            <tr>
                                <td><strong>Usuario:</strong></td>
                                <td th:text="${user.username}">Usuario</td>
                            </tr>
                            <tr>
                                <td><strong>Email:</strong></td>
                                <td th:text="${user.email}">Email</td>
                            </tr>
                            <tr>
                                <td><strong>Nombre Completo:</strong></td>
                                <td th:text="${user.fullName}">Nombre</td>
                            </tr>
                            <tr>
                                <td><strong>Rol:</strong></td>
                                <td>
                                    <span class="badge bg-info" th:text="${user.role.description}">Rol</span>
                                </td>
                            </tr>
                            <tr>
                                <td><strong>Fecha de Registro:</strong></td>
                                <td th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                            </tr>
                        </table>

                        <h5 class="mt-5">Titulaciones</h5>
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Título</th>
                                    <th>Institución</th>
                                    <th>Fecha</th>
                                    <th>Verificada</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="qualification : ${qualifications}">
                                    <td th:text="${qualification.title}">Título</td>
                                    <td th:text="${qualification.issuer}">Institución</td>
                                    <td th:text="${#temporals.format(qualification.issueDate, 'dd/MM/yyyy')}">Fecha</td>
                                    <td>
                                        <span class="badge" th:classappend="${qualification.verified} ? 'bg-success' : 'bg-warning'"
                                              th:text="${qualification.verified ? 'Verificada' : 'Pendiente'}"></span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div th:if="${#lists.isEmpty(qualifications)}" class="alert alert-info">
                            No hay titulaciones registradas para este usuario.
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Verificación</h5>
                        <hr>
                        <form method="post" th:action="${'/verificador/user/' + user.id + '/verify'}">
                            <div class="mb-3">
                                <label for="status" class="form-label">Estado de Verificación</label>
                                <select class="form-select" id="status" name="status">
                                    <option value="VERIFIED">✓ Verificado</option>
                                    <option value="REJECTED">✗ Rechazado</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">
                                <i class="fas fa-check"></i> Verificar
                            </button>
                        </form>
                        <a href="/verificador/users" class="btn btn-outline-secondary w-100 mt-2">
                            <i class="fas fa-arrow-left"></i> Volver
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
