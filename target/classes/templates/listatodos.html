<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Lista de Usuarios</h2>
            <a href="/nuevousuario" class="btn btn-success">+ Nuevo</a>
        </div>
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr><th>ID</th><th>Nombre</th><th>Email</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                    <tr th:each="usu : ${todos}">
                    <td th:text="${usu.id}"></td>
                    <td th:text="${usu.nombre}"></td>
                    <td th:text="${usu.email}"></td>
                        <td>
                            <a th:href="@{/editarusuario/{id}(id=${usu.id})}"
                               class="btn btn-warning btn-sm me-1">Editar</a>
                            <a th:href="@{/borrarusuario/{id}(id=${usu.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Eliminar usuario?')">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
    </div>
</body>
</html>
